[workspace]
authors = ["Jainam1673"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "🔥 Mojo Weather Data Pipeline"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Development tasks
dev = "pixi shell"
install = "echo 'Dependencies installed via pixi'"

# Pipeline management
start-pipeline = { depends-on = ["init-db", "start-api", "start-ui"] }

# Data processing tasks
test-mojo = "cd .. && mojo src/processors/weather_processor.mojo"
generate-data = "cd .. && python -c 'import requests; requests.post(\"http://localhost:8000/generate-data\", json={\"num_points\": 1000})'"

# Server tasks
start-api = "cd .. && uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload"
start-ui = "cd .. && streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0"

# Database tasks
init-db = "cd .. && python src/data/database.py"
reset-db = "cd .. && rm -f weather_data.db && python src/data/database.py"

# Testing and health
health-check = "cd .. && curl -s http://localhost:8000/health | python -m json.tool"
test-api = "cd .. && curl -s http://localhost:8000/ | python -m json.tool"

# Cleanup tasks
clean-logs = "cd .. && rm -rf logs/*.log"
clean-data = "cd .. && rm -f weather_data.db"
clean-all = { depends-on = ["clean-logs", "clean-data"] }

[dependencies]
mojo = ">=25.6.0.dev2025090305,<26"
python = ">=3.11"
fastapi = "*"
uvicorn = "*"
streamlit = "*"
pandas = "*"
numpy = "*"
plotly = "*"
requests = "*"
python-multipart = "*"
pydantic = "*"
scipy = "*"
pytest = "*"
pytest-cov = "*"